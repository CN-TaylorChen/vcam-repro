name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VER}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "SDK: $SDK_PATH ($SDK_VER)"
          ls -l "$THEOS/sdks"

      - name: Ensure ldid
        run: |
          if [ ! -x "$THEOS/bin/ldid" ]; then
            brew install ldid || true
            L="$(command -v ldid || true)"
            if [ -n "$L" ]; then ln -sfn "$L" "$THEOS/bin/ldid"; fi
          fi
          "$THEOS/bin/ldid" -v || true

      - name: Build package
        run: |
          make package FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          ls -l packages/

      - name: Inspect package
        run: |
          set -e
          DEB="$(ls "$GITHUB_WORKSPACE"/packages/*.deb | head -1)"
          echo "deb: $DEB"
          cd "$RUNNER_TEMP"
          ar x "$DEB"
          echo "===== control ====="
          tar xzOf control.tar.gz ./control
          echo "===== files ====="
          tar tvf data.tar.*
          # 关键校验：过滤 plist 必须在包里，否则 MobileSubstrate 不会加载
          tar tf data.tar.* | grep -q "DynamicLibraries/VCamRepro.plist"
          tar tf data.tar.* | grep -q "DynamicLibraries/VCamRepro.dylib"
          echo "OK: dylib + filter plist 都在"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: vcam-repro-deb
          path: packages/*.deb

      # 自签（TrollStore / ESign / Sideloadly）只需要裸 dylib，单独产一份
      - name: Export dylib
        run: |
          set -e
          DEB="$(ls "$GITHUB_WORKSPACE"/packages/*.deb | head -1)"
          cd "$RUNNER_TEMP"
          ar x "$DEB"
          tar xf data.tar.*
          D="Library/MobileSubstrate/DynamicLibraries/VCamRepro.dylib"
          cp "$D" "$GITHUB_WORKSPACE/VCamRepro.dylib"
          lipo -thin arm64 "$D" -output "$GITHUB_WORKSPACE/VCamRepro-arm64.dylib"
          lipo -info "$GITHUB_WORKSPACE/VCamRepro.dylib"
          lipo -info "$GITHUB_WORKSPACE/VCamRepro-arm64.dylib"
          shasum -a 256 "$GITHUB_WORKSPACE"/VCamRepro*.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: vcam-repro-dylib
          path: |
            VCamRepro.dylib
            VCamRepro-arm64.dylib
